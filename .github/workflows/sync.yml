name: Sync Metabase to Supabase

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch from Metabase but skip the Supabase write'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Execute Sync
        env:
        METABASE_URL: ${{ secrets.METABASE_URL }}
        METABASE_SESSION_TOKEN: ${{ secrets.METABASE_SESSION_TOKEN }}
        METABASE_CARD_ID: ${{ secrets.METABASE_CARD_ID }}
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        FULL_REFRESH: "true"
        run: node index.js
