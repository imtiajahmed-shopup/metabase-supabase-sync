name: Sync Metabase to Supabase

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch from Metabase but skip the Supabase write'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Check Required Secrets
        env:
          METABASE_SESSION_TOKEN: ${{ secrets.METABASE_SESSION_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$METABASE_SESSION_TOKEN" ]; then
            echo "METABASE_SESSION_TOKEN: OK"
          else
            echo "METABASE_SESSION_TOKEN: MISSING"
          fi

          if [ -n "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL: OK"
          else
            echo "SUPABASE_URL: MISSING"
          fi

          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY: OK"
          else
            echo "SUPABASE_SERVICE_ROLE_KEY: MISSING"
          fi

      - name: Test Metabase Connectivity
        run: |
          echo "Testing Metabase connectivity..."
          curl -I --connect-timeout 10 https://plmb.shopup.center

      - name: Execute Sync
        env:
          METABASE_SESSION_TOKEN: ${{ secrets.METABASE_SESSION_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: node index.js
